# Build settings
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-assets
  
title: Lisara
email: lisara4898@gmail.com
description: 'Personal Portfolio'
baseurl: "/Portfolio-Auto" # the subpath of your site, e.g. /blog
url: 
portfolio_url: https://li3ara.github.io/Portfolio-Auto/
cv_url: assets/pdf/cv.pdf
repository: LI3ARA/Portfolio-Auto
# twitter: https://twitter.com/johndoe
github: https://github.com/LI3ARA

header_image: assets/images/profile_pic3.png

theme_config:
  appearance: "dark" # can be "light", "dark" or "auto"
  appearance_toggle: true # if appearance can be switched by user

google_analytics:
  tracking_id: G-G4XQCB0L4K

comments: true
disqus: purelog-jekyll

author: Lisara
author_bio: >-
  Lisara Gajaweera is a final year undergraduate student reading Artificial Intelligence and Data Science. Her research interests include deep learning, computer vision, and natural language processing.
author_pic: https://brennanbrown.ca/img/avatar.png
paginate: 4
paginate_path: "/:num/"

markdown: kramdown

sass:
  style: compressed

assets:
  baseurl: /assets

# Exclude from processing.
exclude:
  - ".jekyll-cache"
  - "Gemfile"
  - "Gemfile.lock"
